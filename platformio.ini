; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html
;
; Compile-time configuration (defaults live in the source via #ifndef guards).
; Override per build with command-line flags through PLATFORMIO_BUILD_FLAGS:
;
;   DEVICE_ID     unit id on the LoRa network        (default 0)
;   LOG_LEVEL     min log severity: ERROR|WARN|INFO|DEBUG (default DEBUG)
;   ENABLE_MODES  1 = IDLE/USER_FACING switching, 0 = always USER_FACING (default 1)
;
; Example:
;   PLATFORMIO_BUILD_FLAGS="-DDEVICE_ID=3 -DLOG_LEVEL=INFO -DENABLE_MODES=0" pio run -t upload

[env:upesy_wroom_c6]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = seeed_xiao_esp32c6
framework = arduino
upload_port = /dev/cu.usbmodem101
lib_deps = 
	adafruit/Adafruit BNO055 @ ^1.6.4
	adafruit/Adafruit Unified Sensor @ ^1.1.14
	adafruit/Adafruit BusIO @ ^1.14.5
	https://github.com/PaulStoffregen/OneWire/archive/refs/heads/master.zip
	mikalhart/TinyGPSPlus @ ^1.0.3
	sandeepmistry/LoRa@^0.8.0
	fastled/FastLED @ ^3.10.3
	adafruit/Adafruit PCF8574@^1.1.2
